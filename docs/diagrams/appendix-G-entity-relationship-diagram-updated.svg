<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
<title>Updated Entity Relationship Diagram — NexHRIS</title>
<rect width="1500" height="980" fill="white"/>
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.box{fill:#fff;stroke:#222;stroke-width:1.4}.title{font-size:14px;font-weight:bold}.field{font-size:11px}.rel{stroke:#444;stroke-width:1.2;fill:none}.card{font-size:11px;font-style:italic;fill:#333}.group{fill:#f2f6fb;stroke:#567;stroke-width:1}</style></defs>
<text x="750" y="28" text-anchor="middle" class="title" font-size="20">NEXHRIS — CURRENT CORE DATA MODEL</text>
<text x="750" y="48" text-anchor="middle" class="card">Primary keys are marked PK; foreign keys are marked FK. Detail tables are grouped where they share the same user relationship.</text>

<!-- helper boxes -->
<g id="users"><rect x="620" y="350" width="260" height="170" class="box"/><text x="750" y="374" text-anchor="middle" class="title">users</text><path d="M620 384H880" class="rel"/><text x="635" y="405" class="field">PK id</text><text x="635" y="423" class="field">college_id (FK) · department_id (FK)</text><text x="635" y="441" class="field">position_id (FK) · role · email</text><text x="635" y="459" class="field">employee_no · name · status</text><text x="635" y="477" class="field">profile_photo · public_verification_token</text><text x="635" y="495" class="field">password · login security fields</text></g>
<g><rect x="40" y="90" width="220" height="105" class="box"/><text x="150" y="114" text-anchor="middle" class="title">colleges</text><path d="M40 124H260" class="rel"/><text x="55" y="146" class="field">PK id</text><text x="55" y="164" class="field">name · dean_id (FK)</text><text x="55" y="182" class="field">code · status</text></g>
<g><rect x="300" y="90" width="220" height="105" class="box"/><text x="410" y="114" text-anchor="middle" class="title">departments</text><path d="M300 124H520" class="rel"/><text x="315" y="146" class="field">PK id</text><text x="315" y="164" class="field">college_id (FK) · head_id (FK)</text><text x="315" y="182" class="field">name · status</text></g>
<g><rect x="560" y="90" width="220" height="105" class="box"/><text x="670" y="114" text-anchor="middle" class="title">positions</text><path d="M560 124H780" class="rel"/><text x="575" y="146" class="field">PK id</text><text x="575" y="164" class="field">title · rank · active</text><text x="575" y="182" class="field">position classification</text></g>
<g><rect x="820" y="90" width="220" height="105" class="box"/><text x="930" y="114" text-anchor="middle" class="title">two_factor_challenges</text><path d="M820 124H1040" class="rel"/><text x="835" y="146" class="field">PK id · user_id (FK)</text><text x="835" y="164" class="field">code_hash · expires_at · attempts</text><text x="835" y="182" class="field">consumed_at</text></g>
<g><rect x="1080" y="90" width="220" height="105" class="box"/><text x="1190" y="114" text-anchor="middle" class="title">sessions / reset tokens</text><path d="M1080 124H1300" class="rel"/><text x="1095" y="146" class="field">sessions.user_id (FK)</text><text x="1095" y="164" class="field">password_reset_tokens.email</text><text x="1095" y="182" class="field">authentication support data</text></g>

<!-- PDS -->
<g><rect x="40" y="300" width="220" height="105" class="box"/><text x="150" y="324" text-anchor="middle" class="title">pds_templates</text><path d="M40 334H260" class="rel"/><text x="55" y="356" class="field">PK id · uploaded_by (FK)</text><text x="55" y="374" class="field">version · file_path · checksum</text><text x="55" y="392" class="field">is_active</text></g>
<g><rect x="300" y="300" width="220" height="125" class="box"/><text x="410" y="324" text-anchor="middle" class="title">pds_submissions</text><path d="M300 334H520" class="rel"/><text x="315" y="356" class="field">PK id · user_id (FK)</text><text x="315" y="374" class="field">pds_template_id (FK)</text><text x="315" y="392" class="field">status · applicable_year</text><text x="315" y="410" class="field">reviewed_by (FK) · pdf_path</text></g>
<g><rect x="40" y="450" width="220" height="130" class="box"/><text x="150" y="474" text-anchor="middle" class="title">pds_submission_revisions</text><path d="M40 484H260" class="rel"/><text x="55" y="506" class="field">PK id · pds_submission_id (FK)</text><text x="55" y="524" class="field">pds_template_id (FK)</text><text x="55" y="542" class="field">version · outcome · remarks</text><text x="55" y="560" class="field">reviewed_by (FK)</text></g>
<g><rect x="300" y="450" width="220" height="130" class="group"/><text x="410" y="474" text-anchor="middle" class="title">PDS detail tables</text><path d="M300 484H520" class="rel"/><text x="315" y="506" class="field">pds_personal_information</text><text x="315" y="524" class="field">pds_family_backgrounds · children</text><text x="315" y="542" class="field">education · eligibility · training</text><text x="315" y="560" class="field">work experience · declarations</text></g>

<!-- Leave and ledger -->
<g><rect x="1000" y="300" width="220" height="105" class="box"/><text x="1110" y="324" text-anchor="middle" class="title">leave_form_templates</text><path d="M1000 334H1220" class="rel"/><text x="1015" y="356" class="field">PK id · uploaded_by (FK)</text><text x="1015" y="374" class="field">version · file_path · checksum</text><text x="1015" y="392" class="field">is_active</text></g>
<g><rect x="1260" y="300" width="220" height="145" class="box"/><text x="1370" y="324" text-anchor="middle" class="title">leave_applications</text><path d="M1260 334H1480" class="rel"/><text x="1275" y="356" class="field">PK id · user_id (FK)</text><text x="1275" y="374" class="field">leave_form_template_id (FK)</text><text x="1275" y="392" class="field">dean_id · hr_id · director_id</text><text x="1275" y="410" class="field">status · leave_type · dates · days</text><text x="1275" y="428" class="field">leave_ledger_entry_id (FK)</text></g>
<g><rect x="1000" y="470" width="220" height="125" class="box"/><text x="1110" y="494" text-anchor="middle" class="title">leave_approvals</text><path d="M1000 504H1220" class="rel"/><text x="1015" y="526" class="field">PK id · leave_application_id (FK)</text><text x="1015" y="544" class="field">user_id (FK) · stage · action</text><text x="1015" y="562" class="field">remarks · timestamps</text></g>
<g><rect x="1260" y="490" width="220" height="125" class="box"/><text x="1370" y="514" text-anchor="middle" class="title">leave_ledger_entries</text><path d="M1260 524H1480" class="rel"/><text x="1275" y="546" class="field">PK id · user_id (FK)</text><text x="1275" y="564" class="field">leave_application_id (FK)</text><text x="1275" y="582" class="field">encoded_by (FK) · ledger · balances</text><text x="1275" y="600" class="field">period · days · type</text></g>
<g><rect x="620" y="590" width="220" height="105" class="box"/><text x="730" y="614" text-anchor="middle" class="title">leave_balances</text><path d="M620 624H840" class="rel"/><text x="635" y="646" class="field">PK id · user_id (FK, unique)</text><text x="635" y="664" class="field">vacation · sick · service credits</text><text x="635" y="682" class="field">as-of values</text></g>
<g><rect x="880" y="650" width="220" height="105" class="box"/><text x="990" y="674" text-anchor="middle" class="title">employee_ledgers</text><path d="M880 684H1100" class="rel"/><text x="895" y="706" class="field">PK id · user_id (FK, unique)</text><text x="895" y="724" class="field">ledger_template_id (FK)</text><text x="895" y="742" class="field">last_edited_by (FK)</text></g>
<g><rect x="1140" y="650" width="220" height="105" class="box"/><text x="1250" y="674" text-anchor="middle" class="title">ledger_changes</text><path d="M1140 684H1360" class="rel"/><text x="1155" y="706" class="field">PK id · employee_ledger_id (FK)</text><text x="1155" y="724" class="field">changed_by (FK) · before_values</text><text x="1155" y="742" class="field">change_type</text></g>
<g><rect x="360" y="650" width="220" height="105" class="box"/><text x="470" y="674" text-anchor="middle" class="title">ledger_templates</text><path d="M360 684H580" class="rel"/><text x="375" y="706" class="field">PK id · uploaded_by (FK)</text><text x="375" y="724" class="field">version · file_path · is_active</text><text x="375" y="742" class="field">official ledger form</text></g>

<!-- Communication / audit -->
<g><rect x="40" y="650" width="220" height="105" class="box"/><text x="150" y="674" text-anchor="middle" class="title">hr_policies / policy_views</text><path d="M40 684H260" class="rel"/><text x="55" y="706" class="field">hr_policies.created_by (FK)</text><text x="55" y="724" class="field">hr_policy_views.hr_policy_id (FK)</text><text x="55" y="742" class="field">hr_policy_views.user_id (FK)</text></g>
<g><rect x="40" y="800" width="220" height="105" class="box"/><text x="150" y="824" text-anchor="middle" class="title">announcements</text><path d="M40 834H260" class="rel"/><text x="55" y="856" class="field">PK id · college_id (FK)</text><text x="55" y="874" class="field">posted_by (FK) · title · body</text><text x="55" y="892" class="field">publication status</text></g>
<g><rect x="300" y="800" width="220" height="105" class="box"/><text x="410" y="824" text-anchor="middle" class="title">notifications</text><path d="M300 834H520" class="rel"/><text x="315" y="856" class="field">PK id · notifiable_id (FK)</text><text x="315" y="874" class="field">type · data · read_at</text><text x="315" y="892" class="field">polymorphic recipient</text></g>
<g><rect x="620" y="800" width="220" height="105" class="box"/><text x="730" y="824" text-anchor="middle" class="title">activity_logs</text><path d="M620 834H840" class="rel"/><text x="635" y="856" class="field">PK id · user_id (FK)</text><text x="635" y="874" class="field">action · description · subject</text><text x="635" y="892" class="field">IP address · browser</text></g>
<g><rect x="880" y="800" width="220" height="105" class="box"/><text x="990" y="824" text-anchor="middle" class="title">service_records</text><path d="M880 834H1100" class="rel"/><text x="895" y="856" class="field">PK id · user_id (FK)</text><text x="895" y="874" class="field">encoded_by (FK) · dates</text><text x="895" y="892" class="field">record_type · status</text></g>

