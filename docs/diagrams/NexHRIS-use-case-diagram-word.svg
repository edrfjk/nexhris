<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
<title>NexHRIS Use Case Diagram — Login and Role-Based Navigation</title>
<rect width="1600" height="1120" fill="#ffffff"/>
<defs>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#111}.boundary{fill:#fbfbfb;stroke:#111;stroke-width:2}.auth{fill:#eaf2ff;stroke:#1e4f8a;stroke-width:2}.uc{fill:#fff;stroke:#333;stroke-width:1.5}.role{fill:#f6f6f6;stroke:#777;stroke-width:1.2}.actor{stroke:#222;stroke-width:2;fill:none}.line{stroke:#555;stroke-width:1.3;fill:none}.dash{stroke:#555;stroke-width:1.1;stroke-dasharray:6 4;fill:none}.title{font-size:22px;font-weight:bold}.section{font-size:15px;font-weight:bold}.normal{font-size:14px}.small{font-size:12px}.note{font-size:13px;font-style:italic;fill:#444}
  </style>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#555"/></marker>
</defs>

<text x="800" y="32" text-anchor="middle" class="title">NexHRIS Use Case Diagram</text>
<text x="800" y="56" text-anchor="middle" class="normal">Login first, then access is limited to the functions represented by the user’s role and navbar</text>

<!-- Authentication sequence -->
<rect x="310" y="78" width="980" height="116" rx="8" class="auth"/>
<text x="800" y="101" text-anchor="middle" class="section">AUTHENTICATION PROCESS</text>
<ellipse cx="500" cy="145" rx="145" ry="25" class="uc"/><text x="500" y="150" text-anchor="middle" class="normal">1. Log in / Accept Terms</text>
<path d="M645 145H710" class="line" marker-end="url(#arrow)"/>
<ellipse cx="830" cy="145" rx="145" ry="25" class="uc"/><text x="830" y="150" text-anchor="middle" class="normal">2. Verify account if required</text>
<path d="M975 145H1040" class="line" marker-end="url(#arrow)"/>
<ellipse cx="1160" cy="145" rx="105" ry="25" class="uc"/><text x="1160" y="150" text-anchor="middle" class="normal">3. Open dashboard</text>

<!-- actors -->
<g transform="translate(70,115)"><circle cx="30" cy="15" r="13" fill="white" stroke="#222" stroke-width="2"/><path d="M30 28v42m-27-26h54M30 70L9 100m21-30l21 30" class="actor"/><text x="30" y="125" text-anchor="middle" class="section">Employee</text></g>
<g transform="translate(70,385)"><circle cx="30" cy="15" r="13" fill="white" stroke="#222" stroke-width="2"/><path d="M30 28v42m-27-26h54M30 70L9 100m21-30l21 30" class="actor"/><text x="30" y="125" text-anchor="middle" class="section">Dean</text></g>
<g transform="translate(70,655)"><circle cx="30" cy="15" r="13" fill="white" stroke="#222" stroke-width="2"/><path d="M30 28v42m-27-26h54M30 70L9 100m21-30l21 30" class="actor"/><text x="30" y="125" text-anchor="middle" class="section">Campus Director</text></g>
<g transform="translate(70,925)"><circle cx="30" cy="15" r="13" fill="white" stroke="#222" stroke-width="2"/><path d="M30 28v42m-27-26h54M30 70L9 100m21-30l21 30" class="actor"/><text x="30" y="125" text-anchor="middle" class="section">HR Administrator</text></g>
<path d="M130 145H355 M130 415H355 M130 685H355 M130 955H355" class="line"/>

<!-- system boundary -->
<rect x="355" y="215" width="1190" height="850" rx="8" class="boundary"/>
<text x="950" y="244" text-anchor="middle" class="section">NEXHRIS ROLE-BASED NAVIGATION</text>
