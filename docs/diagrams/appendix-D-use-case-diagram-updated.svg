<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900">
<title>Updated Use Case Diagram — NexHRIS</title>
<rect width="1100" height="900" fill="white"/>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.uc{fill:#fff;stroke:#222;stroke-width:1.5}.assoc{stroke:#333;stroke-width:1.2;fill:none}.inc{stroke:#555;stroke-width:1;stroke-dasharray:5 4;fill:none;marker-end:url(#arrow)}.small{font-size:12px}.label{font-size:13px;font-style:italic}.head{font-size:16px;font-weight:bold}</style>
</defs>
<rect x="225" y="25" width="650" height="835" rx="4" fill="#fafafa" stroke="#111" stroke-width="2"/>
<text x="550" y="52" text-anchor="middle" class="head">NEXHRIS</text>
<text x="550" y="75" text-anchor="middle" class="small">Authentication precedes access to all protected functions</text>

<!-- Authentication gate -->
<rect x="390" y="95" width="320" height="48" rx="24" class="uc"/>
<text x="550" y="124" text-anchor="middle">1. LOG IN / ACCEPT TERMS</text>
<rect x="390" y="160" width="320" height="48" rx="24" class="uc"/>
<text x="550" y="189" text-anchor="middle">2. VERIFY ACCOUNT (authorized roles)</text>
<rect x="390" y="225" width="320" height="48" rx="24" class="uc"/>
<text x="550" y="254" text-anchor="middle">3. OPEN ROLE DASHBOARD</text>
<path d="M550 143V160 M550 208V225" class="inc"/>
<text x="562" y="154" class="label">&lt;&lt;include&gt;&gt;</text>
<text x="562" y="219" class="label">&lt;&lt;include&gt;&gt;</text>

<!-- Employee -->
<g transform="translate(80,150)"><circle cx="25" cy="15" r="12" fill="white" stroke="#222"/><path d="M25 27v35m-23-22h46M25 62L7 88m18-26l18 26" class="assoc"/><text x="25" y="110" text-anchor="middle" class="head">Employee</text></g>
<path d="M105 185L390 119 M105 185L390 249" class="assoc"/>

<!-- Dean -->
<g transform="translate(910,145)"><circle cx="25" cy="15" r="12" fill="white" stroke="#222"/><path d="M25 27v35m-23-22h46M25 62L7 88m18-26l18 26" class="assoc"/><text x="25" y="110" text-anchor="middle" class="head">Dean</text></g>
<path d="M910 180L710 119 M910 180L710 249" class="assoc"/>

<!-- HR -->
<g transform="translate(70,680)"><circle cx="25" cy="15" r="12" fill="white" stroke="#222"/><path d="M25 27v35m-23-22h46M25 62L7 88m18-26l18 26" class="assoc"/><text x="25" y="110" text-anchor="middle" class="head">HR Administrator</text></g>
<path d="M105 715L390 119 M105 715L390 249" class="assoc"/>

<!-- Director -->
<g transform="translate(910,680)"><circle cx="25" cy="15" r="12" fill="white" stroke="#222"/><path d="M25 27v35m-23-22h46M25 62L7 88m18-26l18 26" class="assoc"/><text x="25" y="110" text-anchor="middle" class="head">Campus Director</text></g>
<path d="M910 715L710 119 M910 715L710 249" class="assoc"/>

<!-- Employee functions -->
<rect x="260" y="320" width="230" height="42" rx="21" class="uc"/><text x="375" y="346" text-anchor="middle">File Leave Application</text>
<rect x="260" y="380" width="230" height="42" rx="21" class="uc"/><text x="375" y="406" text-anchor="middle">Submit Personal Data Sheet</text>
<rect x="260" y="440" width="230" height="42" rx="21" class="uc"/><text x="375" y="466" text-anchor="middle">View Leave Ledger</text>
<rect x="260" y="500" width="230" height="42" rx="21" class="uc"/><text x="375" y="526" text-anchor="middle">View Digital ID / Verify QR</text>
<rect x="260" y="560" width="230" height="42" rx="21" class="uc"/><text x="375" y="586" text-anchor="middle">Read Policies / Announcements</text>
<path d="M390 273L375 320 M390 273L375 380 M390 273L375 440 M390 273L375 500 M390 273L375 560" class="inc"/>
<text x="300" y="305" class="label">&lt;&lt;include&gt;&gt;</text>

<!-- Administration functions -->
<rect x="610" y="320" width="230" height="42" rx="21" class="uc"/><text x="725" y="346" text-anchor="middle">Review Leave Applications</text>
<rect x="610" y="380" width="230" height="42" rx="21" class="uc"/><text x="725" y="406" text-anchor="middle">Review PDS Requests</text>
<rect x="610" y="440" width="230" height="42" rx="21" class="uc"/><text x="725" y="466" text-anchor="middle">Maintain Ledgers / Post Credits</text>
<rect x="610" y="500" width="230" height="42" rx="21" class="uc"/><text x="725" y="526" text-anchor="middle">Manage Accounts and Units</text>
<rect x="610" y="560" width="230" height="42" rx="21" class="uc"/><text x="725" y="586" text-anchor="middle">Manage Forms, Policies, Reports</text>
<rect x="610" y="620" width="230" height="42" rx="21" class="uc"/><text x="725" y="646" text-anchor="middle">View Calendar / Activity Log</text>
<path d="M710 273L725 320 M710 273L725 380 M710 273L725 440 M710 273L725 500 M710 273L725 560 M710 273L725 620" class="inc"/>
<text x="735" y="305" class="label">&lt;&lt;include&gt;&gt;</text>
<text x="550" y="815" text-anchor="middle" class="small">Flow interpretation: users authenticate first; the dashboard then exposes only the use cases permitted by role.</text>
</svg>
